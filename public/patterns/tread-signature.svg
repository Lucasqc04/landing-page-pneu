<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 1200" fill="none">
  <defs>
    <pattern id="treadPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 2L8 30L30 58" stroke="#0b1016" stroke-opacity="0.18" stroke-width="1.6" />
      <path d="M30 2L52 30L30 58" stroke="#0b1016" stroke-opacity="0.18" stroke-width="1.6" />
      <path d="M30 7V53" stroke="#0b1016" stroke-opacity="0.08" stroke-width="1.2" />
    </pattern>
    <linearGradient id="edgeFade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset="0.22" stop-color="white" stop-opacity="1" />
      <stop offset="0.78" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
